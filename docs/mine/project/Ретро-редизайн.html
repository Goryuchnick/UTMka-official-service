<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#f0eee9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
  #root{width:100vw;height:100vh;}

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="variantA.jsx"></script>
<script type="text/babel" src="variantB.jsx"></script>
<script type="text/babel" src="variantC.jsx"></script>
<script type="text/babel" src="variantD.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  return (
    <DesignCanvas
      title="alex-pronin.ru · ретро-редизайн"
      subtitle="CRT-терминал × аркадный автомат. Amber phosphor, pac-man, pixel-лого, 3D-картриджи."
    >
      <DCSection
        id="home"
        title="Главная — две вариации"
        subtitle="A: углублённый CRT-терминал с параллакс-картриджами. B: аркадный автомат, агрессивнее, погоня призраков."
      >
        <DCArtboard id="varA" label="A · Deep CRT · спокойный, дата-плотный" width={1180} height={1560}>
          <VariantA />
        </DCArtboard>
        <DCArtboard id="varB" label="B · Arcade Cabinet · динамичный, 1UP-эстетика" width={1180} height={1560}>
          <VariantB />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="course"
        title="Страница курса по ИИ"
        subtitle="Та же CRT-вселенная: герой-маркиз, pac-man-трек программы, прайс-карточка, FAQ."
      >
        <DCArtboard id="varC" label="C · Лендинг курса · /курс.ии · free" width={1180} height={2800}>
          <VariantC />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="lesson"
        title="Шаблон страницы урока"
        subtitle="Урок 1.1 «Как ИИ думает». Светлая тема по умолчанию + переключатель, левое меню курса, саммари, аудио-пересказ, иллюзия чата, тренажёр сравнения, пиксельные иконки, навигация."
      >
        <DCArtboard id="varD" label="D · Урок 1.1 · светлая тема" width={1400} height={5200}>
          <VariantD />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
