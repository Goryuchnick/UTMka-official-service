<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>UTMka promo stage</title>
<style>
  @font-face { font-family: "Yantar"; font-weight: 300 700; src: url("/__stage/Yantar-var.woff2") format("woff2"); }
  @font-face { font-family: "Yantar Text"; font-weight: 400; src: url("/__stage/YantarText-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Yantar Text"; font-weight: 700; src: url("/__stage/YantarText-Bold.woff2") format("woff2"); }
  :root { --ink: #15140f; --ink2: #525048; --ink3: #6e6c64; --accent: #009399; --accent-ink: #006368; --acc: 0,147,153; --bg: #f1f7f7;
    --ease: cubic-bezier(.2,.7,.2,1); --spring: cubic-bezier(.34,1.3,.5,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Yantar Text", sans-serif;
    transition: background-color .9s var(--ease); }
  #field { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .dot { font-family: "Yantar", monospace; }

  /* титры */
  .card { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .logo { font-family: "Yantar", monospace; font-size: 256px; line-height: 384px; font-weight: 700; letter-spacing: 0; display: flex; }
  .logo span { display: inline-block; opacity: 0; transform: translateY(40px); font-variation-settings: "ELSH" 0; font-weight: 300; color: var(--ink);
    transition: opacity .5s var(--ease), transform .7s var(--spring), font-variation-settings 1.1s var(--ease), font-weight 1.1s var(--ease), color .6s; }
  .logo.on span { opacity: 1; transform: none; font-variation-settings: "ELSH" 2; font-weight: 700; }
  .logo span.ka { color: var(--accent); }
  .sub { margin-top: -40px; font-size: 48px; line-height: 64px; color: var(--ink2); opacity: 0; transform: translateY(16px); transition: opacity .6s var(--ease), transform .8s var(--ease); }
  .sub.on { opacity: 1; transform: none; }
  .gone { opacity: 0 !important; transform: translateY(-30px) scale(.98) !important; transition: opacity .45s var(--ease), transform .6s var(--ease) !important; }

  .big { font-size: 88px; line-height: 112px; letter-spacing: -.02em; font-weight: 400; max-width: 1500px; }
  .big .w { display: inline-block; opacity: 0; transform: translateY(36px); transition: opacity .5s var(--ease), transform .7s var(--spring); }
  .big.on .w { opacity: 1; transform: none; }
  .big em { font-style: normal; color: var(--accent-ink); }

  /* подпись над окном */
  #cap { position: absolute; left: 0; right: 0; top: 52px; height: 140px; text-align: center; font-size: 56px; line-height: 72px; letter-spacing: -.012em; z-index: 20; pointer-events: none; }
  #cap > div { position: absolute; left: 50%; top: 0; white-space: nowrap; padding: 10px 36px 14px; border-radius: 40px; transform: translateX(-50%);
    background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); transition: opacity .45s var(--ease), transform .6s var(--ease); }
  #cap > div.out { opacity: 0; transform: translateX(-50%) translateY(-24px); }
  #cap > div.pre { opacity: 0; transform: translateX(-50%) translateY(24px); }
  #cap em { font-style: normal; color: var(--accent-ink); }
  #cap .k { display: block; font-size: 24px; line-height: 32px; line-height: 24px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); margin-bottom: 6px; font-family: "Yantar", monospace; }

  /* окно с приложением */
  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transition: transform 1.1s var(--ease); }
  .win { position: absolute; width: 1440px; height: 900px; border-radius: 26px; overflow: hidden; background: var(--bg);
    box-shadow: 0 60px 120px -50px rgba(21,20,15,.45), 0 0 0 1px rgba(21,20,15,.08); transform-origin: 50% 50%;
    transition: transform 1.2s var(--spring), opacity .7s var(--ease), filter .7s var(--ease); }
  .win iframe { width: 1440px; height: 900px; border: 0; display: block; background: transparent; }
  #w1 { left: 240px; top: 200px; transform: translateY(820px) scale(.84) rotateX(14deg); opacity: 0; }
  #w1.on { transform: scale(.84); opacity: 1; }
  .side { left: 240px; top: 200px; opacity: 0; transform: scale(.6); }

  /* курсор */
  #cursor { pointer-events: none; position: absolute; left: 0; top: 0; width: 34px; height: 34px; opacity: 0; transition: opacity .3s; z-index: 50; filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); }
  #cursor.on { opacity: 1; }
  #ring { pointer-events: none; position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; z-index: 49; transform: scale(.3); }
  #ring.hit { animation: hit .55s var(--ease); }
  @keyframes hit { 0% { opacity: .9; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.4); } }

  .url { font-size: 44px; line-height: 64px; color: var(--ink2); opacity: 0; transform: translateY(14px); transition: opacity .6s var(--ease), transform .8s var(--ease); margin-top: 8px; }
  .url.on { opacity: 1; transform: none; }
  .url b { color: var(--accent-ink); font-weight: 700; }
</style>
</head>
<body>
<canvas id="field" width="1920" height="1080"></canvas>

<div class="card" id="intro">
  <div>
    <div class="logo" id="logo"><span>U</span><span>T</span><span>M</span><span class="ka">k</span><span class="ka">a</span></div>
    <div class="sub" id="sub">конструктор UTM-меток</div>
  </div>
</div>

<div class="card" id="claim"><div class="big" id="big"></div></div>

<div id="cam">
  <div class="win side" id="w2"><iframe id="f2"></iframe></div>
  <div class="win side" id="w3"><iframe id="f3"></iframe></div>
  <div class="win" id="w1"><iframe id="f1"></iframe></div>
</div>

<div id="cap"></div>

<div class="card" id="outro" style="opacity:0">
  <div>
    <div class="logo" id="logo2"><span>U</span><span>T</span><span>M</span><span class="ka">k</span><span class="ka">a</span></div>
    <div class="url" id="url">Бесплатно, без регистрации · <b>utmka.alex-pronin.ru</b></div>
  </div>
</div>

<div id="ring"></div>
<svg id="cursor" viewBox="0 0 34 34"><path d="M5 3 L5 27 L11 21.5 L15.5 31 L19.5 29.2 L15.2 20 L23 20 Z" fill="#15140f" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>

<script>
const $ = (s, r = document) => r.querySelector(s);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
window.__cmds = [];
window.__cursor = { x: 1500, y: 1180 };
window.__done = false;

/* ── поле точек сцены: та же сетка, что в приложении, свет плывёт за курсором ── */
const cv = $('#field'), cx = cv.getContext('2d');
const lamp = { x: 960, y: 540, k: 0 };
let fieldK = 1;
function drawField(t) {
  cx.clearRect(0, 0, 1920, 1080);
  const acc = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();
  const lx = window.__cursor.x, ly = window.__cursor.y;
  lamp.x += (lx - lamp.x) * .12; lamp.y += (ly - lamp.y) * .12;
  for (let y = 10; y < 1080; y += 20) for (let x = 10; x < 1920; x += 20) {
    const dx = x - 960, dy = y - 540, d = Math.sqrt(dx * dx + dy * dy);
    const wave = .5 + .5 * Math.sin(d / 46 - t / 520);
    let b = fieldK * .32 * wave * wave * wave * Math.exp(-d / 900);
    const lx2 = (x - lamp.x) / 120, ly2 = (y - lamp.y) / 120, ld = lx2 * lx2 + ly2 * ly2;
    if (ld < 4) b += .5 * lamp.k * Math.exp(-ld * 1.6);
    if (b < .05) { cx.fillStyle = 'rgba(21,20,15,.13)'; cx.fillRect(x - .9, y - .9, 1.8, 1.8); }
    else { cx.fillStyle = `rgba(${acc},${(.22 + .68 * Math.min(1, b)).toFixed(3)})`; cx.beginPath(); cx.arc(x, y, .9 + 3.5 * Math.pow(Math.min(1, b), .8), 0, 6.283); cx.fill(); }
  }
  requestAnimationFrame(drawField);
}
requestAnimationFrame(drawField);

/* ── акцент сцены вслед за разделом приложения ── */
const ACC = { teal: ['#009399', '#006368', '0,147,153', '#f1f7f7'], green: ['#009956', '#006836', '0,153,86', '#f2f7f4'], rasp: ['#cd3462', '#981b44', '205,52,98', '#faf4f5'], blue: ['#3672e9', '#1c50b5', '54,114,233', '#f3f6fa'] };
function accent(name) { const a = ACC[name], s = document.documentElement.style; s.setProperty('--accent', a[0]); s.setProperty('--accent-ink', a[1]); s.setProperty('--acc', a[2]); s.setProperty('--bg', a[3]); }

/* ── подписи ── */
function caption(html, kicker) {
  const box = $('#cap');
  for (const old of box.children) { old.classList.add('out'); setTimeout(() => old.remove(), 700); }
  if (!html) return;
  const el = document.createElement('div'); el.className = 'pre';
  el.innerHTML = (kicker ? `<span class="k">${kicker}</span>` : '') + html;
  box.appendChild(el); el.getBoundingClientRect(); setTimeout(() => el.classList.remove('pre'), 30);
}
function words(el, html) { el.innerHTML = html.split(' ').map((w, i) => `<span class="w" style="transition-delay:${i * 70}ms">${w}</span>`).join(' '); }

/* ── камера: масштаб и сдвиг слоя с окнами ── */
function cam(scale = 1, x = 0, y = 0, ms = 1100) { const c = $('#cam'); c.style.transitionDuration = ms + 'ms'; c.style.transform = `translate(${x}px, ${y}px) scale(${scale})`; }
/* наехать на точку окна (в координатах приложения 1440×900) так, чтобы она встала в fx, fy сцены */
function focus(ax, ay, scale, fx = 960, fy = 600, ms = 1100) {
  // окно w1: left 240, top 200, масштаб .84 от центра
  const wx = 240 + 720 + (ax - 720) * .84, wy = 200 + 450 + (ay - 450) * .84;
  cam(scale, fx - wx * scale, fy - wy * scale, ms);
}

/* ── курсор ── */
let curAnim = null;
function moveTo(x, y, ms = 700) {
  const from = { ...window.__cursor }, t0 = performance.now();
  return new Promise((res) => {
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / ms), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      window.__cursor.x = from.x + (x - from.x) * e; window.__cursor.y = from.y + (y - from.y) * e;
      $('#cursor').style.transform = `translate(${window.__cursor.x - 5}px, ${window.__cursor.y - 3}px)`;
      if (k < 1) requestAnimationFrame(step); else res();
    };
    step();
  });
}
/* где на сцене элемент из окна f1 */
function where(sel, fx = .5, fy = .5, frame = '#f1') {
  const f = $(frame), doc = f.contentDocument, el = typeof sel === 'string' ? doc.querySelector(sel) : sel;
  if (!el) { console.warn('нет', sel); return null; }
  const fr = f.getBoundingClientRect(), k = fr.width / 1440, r = el.getBoundingClientRect();
  return { x: fr.left + (r.left + r.width * fx) * k, y: fr.top + (r.top + r.height * fy) * k, el };
}
/* элемент за краем прокрутки — плавно подкатываем, как сделал бы человек колесом */
async function reveal(sel) {
  const doc = $('#f1').contentDocument, el = typeof sel === 'string' ? doc.querySelector(sel) : sel;
  if (!el) return;
  let sc = el.parentElement;
  while (sc && !(sc.scrollHeight > sc.clientHeight + 4 && /auto|scroll/.test(getComputedStyle(sc).overflowY))) sc = sc.parentElement;
  if (!sc) return;
  const r = el.getBoundingClientRect(), b = sc.getBoundingClientRect();
  let d = 0;
  if (r.bottom > b.bottom - 60) d = r.bottom - b.bottom + 120;
  else if (r.top < b.top + 20) d = r.top - b.top - 80;
  if (!d) return;
  const from = sc.scrollTop, t0 = performance.now(), ms = 420;
  await new Promise((res) => { const st = () => { const k = Math.min(1, (performance.now() - t0) / ms); sc.scrollTop = from + d * (1 - Math.pow(1 - k, 3)); k < 1 ? requestAnimationFrame(st) : res(); }; st(); });
}
async function clickOn(sel, opts = {}) {
  await reveal(sel);
  let p = where(sel, opts.fx ?? .5, opts.fy ?? .5); if (!p) return;
  await moveTo(p.x, p.y, opts.ms ?? 600);
  /* камера могла ещё ехать — доводим курсор до того места, где элемент сейчас */
  const q = where(p.el, opts.fx ?? .5, opts.fy ?? .5);
  if (q && Math.hypot(q.x - p.x, q.y - p.y) > 2) { await moveTo(q.x, q.y, 160); p = q; }
  await wait(90);
  const ring = $('#ring'); ring.style.left = p.x + 'px'; ring.style.top = p.y + 'px'; ring.classList.remove('hit'); ring.getBoundingClientRect(); ring.classList.add('hit');
  window.__cmds.push({ type: 'click' }); await wait(220);
}
async function type(text, per = 55) { for (const ch of text) { window.__cmds.push({ type: 'key', text: ch }); await wait(per); } }
function findText(sel, text) { return [...$('#f1').contentDocument.querySelectorAll(sel)].find((e) => e.textContent.trim().startsWith(text)); }
const app = () => $('#f1').contentDocument;

/* ── сценарий ── */
async function main() {
  // Сцена 1: знак
  await wait(250);
  $('#logo').classList.add('on');
  [...$('#logo').children].forEach((s, i) => s.style.transitionDelay = i * 100 + 'ms');
  await wait(800); $('#sub').classList.add('on');
  await wait(1200);
  $('#intro').classList.add('gone');

  // Сцена 2: обещание
  await wait(200);
  words($('#big'), 'Ссылки с метками, <em>которые</em> <em>не</em> <em>ломают</em> <em>отчёт</em>');
  $('#big').getBoundingClientRect(); $('#big').classList.add('on');
  await wait(1900);
  $('#claim').classList.add('gone'); fieldK = .35;

  // Сцена 3: генератор
  await wait(150);
  caption('Адрес, площадка, кампания — <em>и ссылка готова</em>', 'Генератор');
  $('#w1').classList.add('on');
  await wait(800);
  $('#cursor').classList.add('on'); lamp.k = 1;
  await clickOn('input[aria-label="Адрес страницы"]', { fx: .15 });
  await type('shop.example.ru/autumn', 28);
  await wait(150);
  await clickOn('.step[data-state="now"] .btn--main');
  await wait(400);
  await clickOn(findText('.tile', 'Пост во ВКонтакте') || '.tile', { fx: .3, fy: .3 });
  await wait(400);
  await clickOn('.step[data-state="now"] input', { fx: .2 });
  focus(480, 700, 1.32, 900, 560, 900);
  await type('Осенняя распродажа', 38);
  await wait(250);
  caption('Объясняет, <em>что сломается в отчёте</em>', 'Проверка на лету');
  await wait(300);
  {
    const issues = app().querySelector('.step[data-state="now"] .issue');
    if (issues) { const r = issues.getBoundingClientRect(); focus(r.left + 300, r.top + 60, 1.45, 900, 560, 800); }
  }
  await wait(1300);
  await clickOn(findText('.step[data-state="now"] .issue-fix', 'Чинить') || '.issue-fix');
  await wait(500);
  cam(1, 0, 0, 800);
  await wait(850);
  await clickOn('.step[data-state="now"] .btn--main');
  await wait(450);
  caption('Готовая ссылка <em>за четыре шага</em>', 'Генератор');
  {
    const r = app().querySelector('.result, .step[data-state="now"]').getBoundingClientRect();
    focus(r.left + 360, r.top + 40, 1.3, 960, 560, 900);
  }
  await wait(1000);
  await clickOn(findText('.btn--main', 'Скопировать') || '.btn--main');
  await wait(700);
  cam(1, 0, 0, 800);
  await wait(850);

  // Сцена 4: пакет
  caption('Сотня ссылок за раз — <em>из таблицы</em>', 'Пакетный режим');
  await clickOn('a.navbtn[href="/batch"]', { ms: 700 });
  accent('green');
  await wait(900);
  await clickOn('.screen-scroll .input input', { fx: .2 });
  await type('shop.example.ru/autumn', 16);
  await clickOn(findText('.btn', 'Вставить пример') || '.btn');
  await wait(500);
  {
    app().querySelector('.batch')?.scrollIntoView({ block: 'center' });
    await wait(80);
    const r = app().querySelector('.batch')?.getBoundingClientRect();
    if (r) focus(r.left + 380, r.top + 100, 1.25, 960, 600, 900);
  }
  await wait(1500);
  cam(1, 0, 0, 800);
  await wait(500);

  // Сцена 5: помощник
  caption('Или просто <em>опишите запуск</em>', 'Помощник');
  await clickOn('.ask-fab', { fx: .2 });
  await wait(350);
  focus(1180, 420, 1.35, 1060, 560, 700);
  await wait(750);
  await clickOn('.ask textarea', { fx: .3, fy: .3 });
  await type('Осень: ВК, телеграм, Директ и рассылка', 22);
  await wait(150);
  await clickOn(app().querySelector('.ask .btn--main'));
  await wait(1000);
  {
    const r = app().querySelector('.ask-list')?.getBoundingClientRect();
    if (r) focus(r.left + 180, r.top + 120, 1.35, 1060, 600, 800);
  }
  await wait(1400);
  cam(1, 0, 0, 800);
  $('#cursor').classList.remove('on'); lamp.k = 0;

  // Сцена 6: три вида
  caption('Светлая, тёмная — <em>и ретро «ПРОНИН-ОС»</em>', 'Оформление');
  accent('teal');
  const w1 = $('#w1'), w2 = $('#w2'), w3 = $('#w3');
  w1.style.transform = 'scale(.62)';
  w2.style.opacity = 1; w2.style.transform = 'translateX(-560px) scale(.5) rotateY(14deg)';
  w3.style.opacity = 1; w3.style.transform = 'translateX(560px) scale(.5) rotateY(-14deg)';
  await wait(2400);

  // Сцена 7: финал
  caption('');
  for (const w of [w1, w2, w3]) { w.style.opacity = 0; w.style.transform += ' translateY(120px)'; }
  fieldK = 1;
  await wait(450);
  $('#outro').style.opacity = 1;
  [...$('#logo2').children].forEach((s, i) => s.style.transitionDelay = i * 90 + 'ms');
  $('#logo2').classList.add('on');
  await wait(800); $('#url').classList.add('on');
  await wait(2000);
  window.__done = true;
}
window.__start = main;
window.__load = (src1 = '/', src2 = '/', src3 = '/') => { $('#f1').src = src1; $('#f2').src = src2; $('#f3').src = src3; };
/* Второе окно — «Точки» тёмные, третье — «ПРОНИН-ОС» тёмная. */
window.__prep = () => {
  const d2 = $('#f2').contentDocument.documentElement;
  d2.dataset.theme = 'dark';
  d2.dataset.skin = 'dots';
  const d3 = $('#f3').contentDocument.documentElement;
  d3.dataset.theme = 'dark';
  delete d3.dataset.skin;
};
</script>
</body>
</html>
