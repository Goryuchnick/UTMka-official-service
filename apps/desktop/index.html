<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UTMka — конструктор UTM-меток</title>

    <!-- Пиксельный шрифт файлами рядом с приложением, а не next/font.
         В вебе его подключает Next и тянет с Google Fonts НА СБОРКЕ; релиз
         десктопа собирается с машины владельца под ТСПУ, где такой поход
         наружу — лишняя точка отказа. Плюс окно обязано работать офлайн.
         Кириллица обязательна: интерфейс русский. -->
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/fonts/press-start-2p-cyrillic.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/fonts/press-start-2p-latin.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212,
          U+2215, U+FEFF, U+FFFD;
      }
      /* Веб получает эту переменную от next/font — здесь задаём её сами. */
      :root {
        --font-pixel: 'Press Start 2P';
      }
    </style>

    <!-- Тема ставится до первой отрисовки — иначе светлая мигает тёмной.
         В вебе тот же скрипт живёт в <head> через THEME_BOOTSTRAP; здесь он
         встроен буквально, потому что серверного рендера нет вовсе. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('utmka.theme')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
