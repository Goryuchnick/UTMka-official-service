<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Логотип UTMka: «UTM» амбером, «ka» бирюзой — те же цвета и та же
       пиксельная сетка, что у иконки приложения и надписи в заголовке окна.
       Буквы нарисованы прямоугольниками, а не текстом: фавикон обязан
       выглядеть одинаково там, где шрифт не подгрузился. -->
  <rect width="32" height="32" rx="6" fill="#0a0a08"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6" fill="none" stroke="#3a3a30"/>

  <!-- UTM, высота 7px, сетка 1px -->
  <g fill="#ffb000">
    <!-- U -->
    <rect x="4" y="6" width="2" height="6"/>
    <rect x="9" y="6" width="2" height="6"/>
    <rect x="5" y="11" width="5" height="2"/>
    <!-- T -->
    <rect x="12" y="6" width="7" height="2"/>
    <rect x="14" y="8" width="3" height="5"/>
    <!-- M -->
    <rect x="20" y="6" width="2" height="7"/>
    <rect x="26" y="6" width="2" height="7"/>
    <rect x="22" y="8" width="2" height="2"/>
    <rect x="24" y="6" width="2" height="2"/>
  </g>

  <!-- ka -->
  <g fill="#5be3d4">
    <!-- k -->
    <rect x="7" y="16" width="2" height="10"/>
    <rect x="11" y="18" width="2" height="2"/>
    <rect x="9" y="20" width="2" height="2"/>
    <rect x="11" y="22" width="2" height="4"/>
    <!-- a -->
    <rect x="16" y="18" width="7" height="2"/>
    <rect x="21" y="20" width="2" height="6"/>
    <rect x="16" y="22" width="5" height="2"/>
    <rect x="16" y="24" width="2" height="2"/>
    <rect x="18" y="24" width="3" height="2"/>
  </g>
</svg>
